<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 Page not found</title>
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #111522;
      color: #f4f6ff;
      font: 16px system-ui, sans-serif;
      text-align: center;
    }

    main { padding: 24px; }

    h1 {
      margin: 0;
      font-size: clamp(64px, 14vw, 120px);
      line-height: 1;
    }

    p { color: #aab3c7; }

    a {
      display: inline-block;
      margin-top: 12px;
      padding: 10px 16px;
      border-radius: 8px;
      background: #8b9cff;
      color: #111522;
      font-weight: 600;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>Page not found or blocked by a blocklist.</p>
  </main>
</body>
</html>
